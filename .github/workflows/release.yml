name: Release

on:
  push:
    tags:
      - "*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for npm trusted publishing
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26.13.1
          cache: true
          require-lockfile: true
      - name: build
        run: pnpm run build
      - name: Publish to npm
        run: pnpm publish --provenance --access public --no-git-checks

  release-note:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Generate release note
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
